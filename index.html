<style>
@font-face{font-family:"Cormorant Garamond";font-weight:400 500;font-style:normal;src:url("./assets/821781da50244c9ac432b786110857b6.ttf") format("truetype")}
body{margin:0}
@keyframes wd-pulse{0%,100%{transform:scale(1)}25%{transform:scale(1.1)}75%{transform:scale(0.9)}}
.wd-venue-button,.wd-venue-link{animation:wd-pulse 2.4s ease-in-out infinite;transform-origin:center}
.wd-venue-link:hover{background:rgba(232,243,247,0.55)!important;border-color:rgba(27,38,82,0.45)!important}
@keyframes wd-ch-in{from{opacity:0}to{opacity:1}}
.wd-ch{opacity:0}
.wd-thanks-text.wd-thanks-on .wd-ch{animation:wd-ch-in .05s linear both}
@media (prefers-reduced-motion:reduce){.wd-ch{opacity:1;animation:none!important}}
@media (prefers-reduced-motion:reduce){.wd-venue-button,.wd-venue-link{animation:none}}
.wd-form-bg{background-image:url("./assets/9c5fabc571677876c7a0095d25aa6e84.webp")}
.wd-input-bg{background-image:url("./assets/62e08b5cc9578cba49f9f586158ee8d6.webp")}
.wd-opt-selected{background-image:url("./assets/37db554ac2a9459918287b69653e487b.webp")}
.wd-opt-default{background-image:url("./assets/6e0db3fe2a882cd4269dcb58aa5b4715.webp")}
.wd-button-bg{background-image:url("./assets/879a534bfd8c995a0f61d5a71d41f316.webp")}
.wd-field::placeholder{color:#7f8997;font-style:italic;font-family:'Cormorant Garamond',serif;opacity:1}
.wd-field:focus{outline:none}
.wd-section-img{opacity:0;transform:translateY(60px);transition:opacity .5s ease,transform .5s ease}
.wd-section-img.wd-in{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.wd-section-img{opacity:1;transform:none;transition:none}}
.wd-col{container-type:inline-size;max-width:min(600px, calc(100vh * 414 / 736));max-width:min(600px, calc(100dvh * 414 / 736))}
@keyframes wd-fade-up{from{opacity:0;transform:translateY(14px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes wd-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes wd-draw-check{from{stroke-dashoffset:48}to{stroke-dashoffset:0}}
@keyframes wd-ring-pop{0%{transform:scale(0.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes wd-float-petal{0%{opacity:0;transform:translateY(15px) scale(0.6) rotate(0deg)}30%{opacity:0.85}100%{opacity:0;transform:translateY(-95px) scale(1.1) rotate(25deg)}}
@keyframes wd-spin{to{transform:rotate(360deg)}}
.wd-form.wd-is-submitted{background-image:none!important;padding:0!important}
.wd-form.wd-is-submitted>.wd-field-group,.wd-form.wd-is-submitted>.wd-submit,.wd-form.wd-is-submitted>.wd-status-msg{display:none!important}
.wd-status-msg{margin:-1cqw 0 0 0;padding:6px 12px;border-radius:6px;text-align:center;font-family:"Cormorant Garamond",serif;font-size:clamp(13px,3.6cqw,20px);line-height:1.35;transition:all .25s ease}
.wd-status-msg.wd-status-error{background:rgba(253,242,242,0.92);border:1px solid rgba(188,84,78,0.35);color:#94302c;animation:wd-shake .4s ease}
.wd-status-msg.wd-status-saved{background:rgba(232,243,247,0.85);border:1px solid rgba(27,38,82,0.18);color:#1B2652;cursor:pointer}
.wd-thankyou-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;padding:0;animation:wd-fade-up .45s ease both}
.wd-ty-img{width:100%;height:auto;aspect-ratio:317/329;display:block;border-radius:18px;box-shadow:0 6px 22px rgba(27,38,82,0.08)}
.wd-ty-back{margin-top:14px;background:rgba(255,255,255,0.9);backdrop-filter:blur(4px);border:1px solid rgba(27,38,82,0.22);border-radius:999px;padding:5px 16px;font-family:'Cormorant Garamond',serif;font-size:clamp(12px,3.2cqw,16px);color:#182851;cursor:pointer;transition:all .2s ease;box-shadow:0 2px 8px rgba(27,38,82,0.06)}
.wd-ty-back:hover{background:#ffffff;border-color:rgba(27,38,82,0.45);transform:translateY(-1px)}
.wd-ty-petal{position:absolute;pointer-events:none;bottom:10%;opacity:0;animation:wd-float-petal 2.6s ease-out forwards}
.wd-spinner{display:inline-block;width:1em;height:1em;border:2px solid rgba(27,38,82,0.25);border-top-color:#1B2652;border-radius:50%;animation:wd-spin .7s linear infinite;vertical-align:middle;margin-right:8px}

/* HIỆU ỨNG RÓT RƯỢU */
@keyframes wd-wine-wave{0%{stroke-dashoffset:160;opacity:0}12%{opacity:0.6}85%{opacity:0.6}100%{stroke-dashoffset:-630;opacity:0}}
@keyframes wd-wine-core{0%{stroke-dashoffset:120;opacity:0}10%{opacity:0.85}88%{opacity:0.85}100%{stroke-dashoffset:-630;opacity:0}}
@keyframes wd-ripple-grow{0%{transform:scale(0.35);opacity:0.85}50%{opacity:0.55}100%{transform:scale(1.6);opacity:0}}
@keyframes wd-mouth-pulse{0%,100%{transform:scale(0.85) translateY(0);opacity:0.7}50%{transform:scale(1.2) translateY(2px);opacity:1}}
@keyframes wd-glass-fizz{0%{transform:translateY(0) scale(0.6);opacity:0}25%{opacity:0.85}80%{opacity:0.75}100%{transform:translateY(-16px) scale(1.1);opacity:0}}
@keyframes wd-sparkle-twinkle{0%,100%{transform:scale(0.35) rotate(0deg);opacity:0.2}50%{transform:scale(1.15) rotate(45deg);opacity:0.95}}
.wd-stream-body-1{stroke-dasharray:180 450;animation:wd-wine-wave 2.6s cubic-bezier(0.4,0,0.6,1) infinite}
.wd-stream-body-2{stroke-dasharray:180 450;animation:wd-wine-wave 2.6s 1.3s cubic-bezier(0.4,0,0.6,1) infinite}
.wd-stream-core-1{stroke-dasharray:110 520;animation:wd-wine-core 2.4s 0.2s cubic-bezier(0.35,0,0.55,1) infinite}
.wd-stream-core-2{stroke-dasharray:110 520;animation:wd-wine-core 2.4s 1.4s cubic-bezier(0.35,0,0.55,1) infinite}
.wd-ripple-1{transform-origin:380px 880px;animation:wd-ripple-grow 2.2s ease-out infinite}
.wd-ripple-2{transform-origin:380px 880px;animation:wd-ripple-grow 2.2s 1.1s ease-out infinite}
.wd-mouth-gleam{transform-origin:388px 295px;animation:wd-mouth-pulse 1.8s ease-in-out infinite}
.wd-fizz-1{animation:wd-glass-fizz 1.9s 0.1s ease-out infinite}
.wd-fizz-2{animation:wd-glass-fizz 2.2s 0.6s ease-out infinite}
.wd-fizz-3{animation:wd-glass-fizz 1.8s 1.1s ease-out infinite}
.wd-fizz-4{animation:wd-glass-fizz 2.4s 1.6s ease-out infinite}
.wd-star-1{transform-origin:82px 248px;animation:wd-sparkle-twinkle 2.5s ease-in-out infinite}
.wd-star-2{transform-origin:86px 442px;animation:wd-sparkle-twinkle 2.8s 1.2s ease-in-out infinite}
.wd-star-3{transform-origin:742px 742px;animation:wd-sparkle-twinkle 3.1s 0.7s ease-in-out infinite}

/* HIỆU ỨNG VÁY ÁO ĐUNG ĐƯA */
@keyframes wd-sway-suit{0%{transform:rotate(-3.2deg)}50%{transform:rotate(3.0deg)}100%{transform:rotate(-3.2deg)}}
@keyframes wd-sway-dress{0%{transform:rotate(3.6deg)}50%{transform:rotate(-3.4deg)}100%{transform:rotate(3.6deg)}}
.wd-suit-sway{position:absolute;top:33.7%;left:29.17%;width:20.83%;height:20.86%;transform-origin:52.5% 2%;animation:wd-sway-suit 4.2s cubic-bezier(0.45,0.05,0.55,0.95) infinite;z-index:2;cursor:pointer;transition:transform .3s ease;display:block}
.wd-dress-sway{position:absolute;top:33.7%;left:40.63%;width:32.03%;height:45.14%;transform-origin:57.7% 1%;animation:wd-sway-dress 5.1s cubic-bezier(0.45,0.05,0.55,0.95) infinite;z-index:3;cursor:pointer;transition:transform .3s ease;display:block}
.wd-suit-sway:hover,.wd-suit-sway:active{animation:wd-sway-suit 2.2s cubic-bezier(0.45,0.05,0.55,0.95) infinite}
.wd-dress-sway:hover,.wd-dress-sway:active{animation:wd-sway-dress 2.6s cubic-bezier(0.45,0.05,0.55,0.95) infinite}

@media (prefers-reduced-motion:reduce){
  .wd-stream-body-1,.wd-stream-body-2,.wd-stream-core-1,.wd-stream-core-2,.wd-ripple-1,.wd-ripple-2,.wd-mouth-gleam,.wd-fizz-1,.wd-fizz-2,.wd-fizz-3,.wd-fizz-4,.wd-star-1,.wd-star-2,.wd-star-3,.wd-suit-sway,.wd-dress-sway{animation:none!important}
}
</style>
</helmet>
<div class="wd-page" style="position: relative; width: 100%; background: #cccccc; display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: 'Cormorant Garamond', serif;">
  <img class="wd-bg" src="./assets/2b315a4a740ef16ec355476c8ec4f4ff.webp" alt="" aria-hidden="true" style="position: fixed; top: 0; left: 0; width: 100%; aspect-ratio: 3072 / 1920; object-fit: cover; display: block">
  <main class="wd-main wd-col" style="position: relative; width: 100%; background: #e8f3f7; display: flex; flex-direction: column; align-items: stretch;">
    <section class="wd-section wd-hero" style="position: relative; width: 100%; aspect-ratio: 414 / 736; overflow: hidden;">
      <video class="wd-hero-video" src="./assets/8904298247c0d5884aef5ac6c84d0058.webm" ref="{{videoRef}}" autoplay="autoplay" muted="muted" playsinline="playsinline" preload="auto" onPlay="{{onVideoPlay}}" onEnded="{{onVideoEnded}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></video>
      <sc-if value="{{heroShown}}" hint-placeholder-val="{{ false }}"><img class="wd-hero-img" src="./assets/54fa7a4e9e537d0f46a7dd1b2f11a075.webp" alt="Lê Ngọc Hải và Nguyễn Thị Kim Anh" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></sc-if>
    </section>
    <div class="wd-content" style="position: relative; width: 100%; display: flex; flex-direction: column; align-items: stretch;">
      <img class="wd-content-bg" src="./assets/a7feeff7c403057d605d82361ebf102c.webp" alt="" aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none;">
      <div class="wd-content-overlay" style="position: absolute; inset: 0; pointer-events: none;">
        <img class="wd-content-texture" src="./assets/1322e67e3c51c38dd25e37ef68c5ecc3.webp" alt="" aria-hidden="true" style="position: sticky; top: 0; width: 100%; aspect-ratio: 1080 / 2520; object-fit: cover; display: block;">
      </div>
      <section class="wd-section wd-venue" style="position: relative; width: 100%; aspect-ratio: 980 / 1396;">
        <a class="wd-venue-link" href="https://maps.app.goo.gl/frR36HVwo9DeBCf16" target="_blank" rel="noopener noreferrer" aria-label="Xem đường đi trên Google Maps" style="position: absolute; top: 56.2%; left: 31%; width: 38%; height: 6%; border-radius: 999px; border: 1px solid rgba(27, 38, 82, 0.18); background: rgba(232, 243, 247, 0.35); box-shadow: 0 2px 8px rgba(27, 38, 82, 0.06); display: block; z-index: 2; cursor: pointer;"></a><img class="wd-section-img wd-venue-img" loading="lazy" decoding="async" ref="{{revealRef}}" src="./assets/tochuc.png" alt="Hôn lễ của chúng mình sẽ được tổ chức tại Mường Thanh Luxury Hạ Long, 17:30 Thứ Bảy, ngày 28.11.2026" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; mix-blend-mode: multiply;">
      </section>
      
      <section class="wd-section wd-timeline" style="position: relative; width: 100%; aspect-ratio: 768 / 1198;">
        <img class="wd-section-img wd-timeline-img" loading="lazy" decoding="async" ref="{{revealRef}}" src="./assets/229db8b751059b4b94262407b19f8821.webp" alt="Timeline: 17:00 Checkin, 17:30 Làm lễ, 19:30 Khai tiệc" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">
        <svg class="wd-wine-overlay" viewBox="0 0 768 1198" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2;" fill="none" aria-hidden="true">
          <defs>
            <filter id="wd-soft-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <linearGradient id="wd-gold-liquid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.95"/>
              <stop offset="25%" stop-color="#FFE79A" stop-opacity="0.85"/>
              <stop offset="60%" stop-color="#FFD54F" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#FFF8E1" stop-opacity="0.95"/>
            </linearGradient>
            <linearGradient id="wd-champagne-gleam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
              <stop offset="50%" stop-color="#FFF3C4" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
            </linearGradient>
            <path id="wd-wine-path"
                  pathLength="630"
                  d="M 388 295
                     C 380 305, 368 322, 368 342
                     C 368 375, 402 392, 403 425
                     C 404 465, 373 475, 373 510
                     C 373 550, 403 555, 403 590
                     C 403 630, 372 642, 372 675
                     C 372 715, 398 722, 398 755
                     C 398 795, 373 825, 373 850
                     C 373 865, 377 875, 380 880"/>
          </defs>

          <!-- Dòng chảy champagne óng ả mềm mại dọc dải màu nước -->
          <use href="#wd-wine-path" fill="none" stroke="url(#wd-gold-liquid)" stroke-width="12" stroke-linecap="round" filter="url(#wd-soft-glow)" class="wd-stream-body-1"/>
          <use href="#wd-wine-path" fill="none" stroke="url(#wd-gold-liquid)" stroke-width="12" stroke-linecap="round" filter="url(#wd-soft-glow)" class="wd-stream-body-2"/>

          <!-- Sợi ánh sáng lấp lánh tâm dòng rượu -->
          <use href="#wd-wine-path" fill="none" stroke="url(#wd-champagne-gleam)" stroke-width="3.5" stroke-linecap="round" class="wd-stream-core-1"/>
          <use href="#wd-wine-path" fill="none" stroke="url(#wd-champagne-gleam)" stroke-width="3.5" stroke-linecap="round" class="wd-stream-core-2"/>

          <!-- Các bọt khí champagne vàng kim lấp lánh trôi nhẹ nhàng dọc dòng chảy -->
          <circle r="3.2" fill="#FFE082" filter="url(#wd-soft-glow)">
            <animateMotion dur="2.6s" repeatCount="indefinite">
              <mpath href="#wd-wine-path"/>
            </animateMotion>
            <animate attributeName="opacity" values="0;0.9;0.9;0.3;0" dur="2.6s" repeatCount="indefinite" keyTimes="0;0.1;0.75;0.92;1"/>
            <animate attributeName="r" values="2.2;3.2;3;2.2" dur="2.6s" repeatCount="indefinite"/>
          </circle>
          <circle r="2.2" fill="#FFFFFF">
            <animateMotion dur="3.0s" begin="0.7s" repeatCount="indefinite">
              <mpath href="#wd-wine-path"/>
            </animateMotion>
            <animate attributeName="opacity" values="0;1;0.95;0" dur="3.0s" begin="0.7s" repeatCount="indefinite" keyTimes="0;0.12;0.88;1"/>
          </circle>
          <circle r="2.8" fill="#FFD54F" filter="url(#wd-soft-glow)">
            <animateMotion dur="2.4s" begin="1.3s" repeatCount="indefinite">
              <mpath href="#wd-wine-path"/>
            </animateMotion>
            <animate attributeName="opacity" values="0;0.85;0.85;0" dur="2.4s" begin="1.3s" repeatCount="indefinite" keyTimes="0;0.1;0.9;1"/>
          </circle>
          <circle r="2" fill="#FFF9C4">
            <animateMotion dur="2.8s" begin="1.9s" repeatCount="indefinite">
              <mpath href="#wd-wine-path"/>
            </animateMotion>
            <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.8s" begin="1.9s" repeatCount="indefinite" keyTimes="0;0.1;0.85;1"/>
          </circle>

          <!-- Giọt rượu và ánh sáng lấp lánh tại miệng chai -->
          <g class="wd-mouth-gleam">
            <circle cx="388" cy="295" r="4.5" fill="#FFE57F" filter="url(#wd-soft-glow)"/>
            <circle cx="388" cy="295" r="2.2" fill="#FFFFFF"/>
          </g>

          <!-- Gợn sóng và bọt sủi tăm trong ly cocktail -->
          <g>
            <ellipse cx="380" cy="880" rx="14" ry="4" fill="none" stroke="#FFE082" stroke-width="1.8" class="wd-ripple-1"/>
            <ellipse cx="380" cy="880" rx="20" ry="5.5" fill="none" stroke="#FFF9C4" stroke-width="1.4" class="wd-ripple-2"/>
          </g>
          <g transform="translate(380, 895)">
            <circle cx="-12" cy="5" r="2.2" fill="#FFE082" class="wd-fizz-1"/>
            <circle cx="10" cy="8" r="2.6" fill="#FFF59D" class="wd-fizz-2"/>
            <circle cx="28" cy="14" r="2.0" fill="#FFFFFF" class="wd-fizz-3"/>
            <circle cx="-2" cy="18" r="2.4" fill="#FFD54F" class="wd-fizz-4"/>
          </g>

          <!-- Ngôi sao vàng kim lấp lánh nghệ thuật -->
          <path class="wd-star-1" d="M 82 240 L 84 246 L 90 248 L 84 250 L 82 256 L 80 250 L 74 248 L 80 246 Z" fill="#E5C158"/>
          <path class="wd-star-2" d="M 86 434 L 88 440 L 94 442 L 88 444 L 86 450 L 84 444 L 78 442 L 84 440 Z" fill="#E5C158"/>
          <path class="wd-star-3" d="M 742 735 L 744 740 L 749 742 L 744 744 L 742 749 L 740 744 L 735 742 L 740 740 Z" fill="#E5C158"/>
        </svg>
      </section>

class Component extends DCLogic {
componentWillUnmount() {

}
showHero() {
if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
if (!(this.state && this.state.heroShown)) this.setState({ heroShown: true });
}
watchVideo() {
const v = this._video;
if (!v) return;
if (v.duration && v.duration - v.currentTime <= 0.1) { this.showHero(); return; }
this._raf = requestAnimationFrame(() => this.watchVideo());
}
renderVals() {
const yes = (this.state && this.state.attend) !== 'no';
return {
yesSelected: yes,
noSelected: !yes,
yesPressed: yes ? 'true' : 'false',
noPressed: yes ? 'false' : 'true',
yesClass: yes ? 'wd-opt-selected' : 'wd-opt-default',
noClass: yes ? 'wd-opt-default' : 'wd-opt-selected',
yesColor: yes ? '#1B2652' : '#7f8997',
noColor: yes ? '#7f8997' : '#1B2652',
pickYes: () => this.setState({ attend: 'yes' }),
pickNo: () => this.setState({ attend: 'no' }),
heroShown: !!(this.state && this.state.heroShown),
revealRef: (el) => {
if (!el || el._wdRv) return;
el._wdRv = true;
if (typeof IntersectionObserver === 'undefined') { el.classList.add('wd-in'); return; }
if (!this._rio) {
this._rio = new IntersectionObserver((entries) => {
entries.forEach((e) => {
if (e.isIntersecting) { e.target.classList.add('wd-in'); this._rio.unobserve(e.target); }

}

this._thanks = el;
const on = () => { if (!(this.state && this.state.thanksOn)) this.setState({ thanksOn: true }); };
if (typeof IntersectionObserver === 'undefined') { setTimeout(on, 0); return; }
this._io = new IntersectionObserver((entries) => {
if (entries.some((e) => e.isIntersecting)) { this._io.disconnect(); on(); }
}, { threshold: 0.6 });
this._io.observe(el);
},

if (!el || el === this._video) return;
this._video = el;
el.muted = true;
el.loop = false;

      p.style.animationDuration = (2.1 + Math.random() * 1.1).toFixed(2) + "s";
      container.appendChild(p);
      setTimeout(() => p.remove(), 3500);
    }
  }

  function renderThankYouCard(form, submitButton, { name, attendance, guests, message }) {
    let card = form.querySelector(".wd-thankyou-card");
    if (!card) {
      card = document.createElement("div");
      card.className = "wd-thankyou-card";
      form.appendChild(card);
    }

    card.innerHTML = `
      <img class="wd-ty-img" src="./assets/camonban.png" alt="Cảm ơn bạn! Chúng mình xin cảm ơn bạn đã đăng kí. Hẹn gặp bạn vào 17h30 ngày 28/11 nhéee">
      <button type="button" class="wd-ty-back">← Sửa lại phản hồi</button>
    `;

    card.style.display = "flex";
    form.classList.add("wd-is-submitted");
    spawnPetals(card);
  }

  // Ẩn thông báo lỗi ngay khi khách bắt đầu nhập liệu
  document.addEventListener("input", (e) => {
    const form = e.target.closest(".wd-form");
    if (!form) return;
    const status = form.querySelector(".wd-status-msg.wd-status-error");
    if (status) status.style.display = "none";
  });

  // Chặn submit mặc định để tránh reload trang khi nhấn phím Enter trong ô input
  document.addEventListener("submit", (e) => {
    if (e.target.closest(".wd-form")) {
      e.preventDefault();
    }
  });

  document.addEventListener("click", async (e) => {
    // Nút quay lại xem form từ Thiệp Cảm Ơn
    const backBtn = e.target.closest(".wd-ty-back");
    if (backBtn) {
      const form = backBtn.closest(".wd-form");
      if (form) {
        form.classList.remove("wd-is-submitted");
        const card = form.querySelector(".wd-thankyou-card");
        if (card) card.style.display = "none";

        const submitButton = form.querySelector(".wd-submit");
        const submitText = submitButton && submitButton.querySelector(".wd-submit-text");
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.style.opacity = "1";
        }
        if (submitText) submitText.textContent = "Gửi lại xác nhận";

        let status = form.querySelector(".wd-status-msg");
        if (!status && submitButton) {
          status = document.createElement("div");
          submitButton.insertAdjacentElement("afterend", status);
        }
        if (status) {
          status.className = "wd-status-msg wd-status-saved";
          status.textContent = "✦ Đã ghi nhận phản hồi • Chạm để xem lại thiệp cảm ơn";
          status.style.display = "block";
        }
      }
      return;
    }

    // Mở lại thiệp cảm ơn khi bấm vào thanh trạng thái đã lưu
    const savedBadge = e.target.closest(".wd-status-msg.wd-status-saved");
    if (savedBadge) {
      const form = savedBadge.closest(".wd-form");
      const card = form && form.querySelector(".wd-thankyou-card");
      if (form && card) {
        card.style.display = "flex";
        form.classList.add("wd-is-submitted");
      }
      return;
    }

    const submitButton = e.target.closest(".wd-submit");
    if (!submitButton || isSubmitting) return;

    const form = submitButton.closest(".wd-form") || document.querySelector(".wd-form");
    if (!form) return;

    const nameInput = form.querySelector("#wd-name");
    const countInput = form.querySelector("#wd-count");
    const messageInput = form.querySelector("#wd-msg");
    const yesButton = form.querySelector(".wd-opt-yes");
    const submitText = submitButton.querySelector(".wd-submit-text");

    const name = nameInput ? nameInput.value.trim() : "";
    const count = countInput ? countInput.value.trim() : "";
    const message = messageInput ? messageInput.value.trim() : "";

    const attendance = (yesButton && yesButton.getAttribute("aria-pressed") === "true")
      ? "yes"
      : "no";

    if (!name) {
      showError(form, submitButton, "Vui lòng nhập tên của bạn nhé!");
      if (nameInput) nameInput.focus();
      return;
    }

    if (attendance === "yes") {
      const guests = Number(count);
      if (!count || !Number.isInteger(guests) || guests < 1) {
        showError(form, submitButton, "Vui lòng nhập số lượng người tham dự hợp lệ!");
        if (countInput) countInput.focus();
        return;
      }
    }

    const guestsVal = attendance === "yes" ? count : "0";
    const data = new URLSearchParams();
    data.append("name", name);
    data.append("attendance", attendance);
    data.append("guests", guestsVal);
    data.append("message", message);

    isSubmitting = true;
    submitButton.disabled = true;
    submitButton.style.opacity = "0.75";
    const originalBtnHTML = submitText ? submitText.innerHTML : "Xác nhận gửi";
    if (submitText) {
      submitText.innerHTML = `<span class="wd-spinner"></span>Đang gửi lời hồi đáp...`;
    }

    const existingStatus = form.querySelector(".wd-status-msg");
    if (existingStatus) existingStatus.style.display = "none";

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        body: data
      });

      isSubmitting = false;
      if (submitText) submitText.innerHTML = originalBtnHTML;
      renderThankYouCard(form, submitButton, {
        name,
        attendance,
        guests: guestsVal,
        message
      });
    } catch (error) {
      console.error("RSVP Error:", error);
      isSubmitting = false;
      submitButton.disabled = false;
      submitButton.style.opacity = "1";
      if (submitText) submitText.innerHTML = originalBtnHTML;
      showError(form, submitButton, "Chưa thể kết nối, vui lòng thử lại sau giây lát!");
    }
  });
})();
</script>
</body>
</html>
