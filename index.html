<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":5920}}'>
class Component extends DCLogic {
componentWillUnmount() {
if (this._raf) cancelAnimationFrame(this._raf);
if (this._io) this._io.disconnect();
if (this._rio) this._rio.disconnect();
}
showHero() {
if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
if (!(this.state && this.state.heroShown)) this.setState({ heroShown: true });
}
watchVideo() {
const v = this._video;
if (!v) return;
if (v.duration && v.duration - v.currentTime <= 0.1) { this.showHero(); return; }
this._raf = requestAnimationFrame(() => this.watchVideo());
}
renderVals() {
const yes = (this.state && this.state.attend) !== 'no';
return {
yesSelected: yes,
noSelected: !yes,
yesPressed: yes ? 'true' : 'false',
noPressed: yes ? 'false' : 'true',
yesClass: yes ? 'wd-opt-selected' : 'wd-opt-default',
noClass: yes ? 'wd-opt-default' : 'wd-opt-selected',
yesColor: yes ? '#444a54' : '#666b74',
noColor: yes ? '#666b74' : '#444a54',
pickYes: () => this.setState({ attend: 'yes' }),
pickNo: () => this.setState({ attend: 'no' }),
heroShown: !!(this.state && this.state.heroShown),
revealRef: (el) => {
if (!el || el._wdRv) return;
el._wdRv = true;
if (typeof IntersectionObserver === 'undefined') { el.classList.add('wd-in'); return; }
if (!this._rio) {
this._rio = new IntersectionObserver((entries) => {
entries.forEach((e) => {
if (e.isIntersecting) { e.target.classList.add('wd-in'); this._rio.unobserve(e.target); }
});
}, { threshold: 0.2 });
}
this._rio.observe(el);
},
thanksClass: (this.state && this.state.thanksOn) ? 'wd-thanks-on' : '',
thanksRef: (el) => {
if (!el || el === this._thanks) return;
this._thanks = el;
const on = () => { if (!(this.state && this.state.thanksOn)) this.setState({ thanksOn: true }); };
if (typeof IntersectionObserver === 'undefined') { setTimeout(on, 0); return; }
this._io = new IntersectionObserver((entries) => {
if (entries.some((e) => e.isIntersecting)) { this._io.disconnect(); on(); }
}, { threshold: 0.6 });
this._io.observe(el);
},
videoRef: (el) => {
if (!el || el === this._video) return;
this._video = el;
el.muted = true;
el.loop = false;
const p = el.play();
if (p && p.catch) p.catch((err) => { if (err && err.name === 'NotAllowedError') this.showHero(); });
},
onVideoPlay: () => { if (this._raf) cancelAnimationFrame(this._raf); this.watchVideo(); },
onVideoEnded: (e) => { if (e && e.currentTarget) e.currentTarget.pause(); this.showHero(); }
};
}
}
